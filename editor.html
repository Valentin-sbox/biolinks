<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lyink — Editor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1e1e1e;
      --surface-3: #282828;
      --border: #2a2a2a;
      --border-focus: #444;
      --text: #e5e5e5;
      --text-2: #999;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
    }

    /* Panel */
    .panel {
      overflow-y: auto;
      padding: 24px;
      border-right: 1px solid var(--border);
    }
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .panel-logo span { color: var(--accent); }
    .panel-actions { display: flex; gap: 8px; }

    /* Sections */
    .section {
      margin-bottom: 24px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-2);
    }

    /* Form */
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--border-focus);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface-3); border-color: var(--border-focus); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,0.1); border-color: var(--danger); }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-icon {
      width: 32px; height: 32px;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* Link Item */
    .link-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      cursor: grab;
      transition: all 0.15s;
    }
    .link-item:hover { border-color: var(--border-focus); }
    .link-item.dragging { opacity: 0.5; }
    .link-item.drag-over { border-color: var(--accent); background: rgba(59,130,246,0.05); }
    .link-drag {
      color: var(--text-2);
      cursor: grab;
      flex-shrink: 0;
    }
    .link-info { flex: 1; min-width: 0; }
    .link-info-title { font-size: 13px; font-weight: 500; }
    .link-info-url { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-actions { display: flex; gap: 4px; }

    /* Section Item (for catalog sections) */
    .section-item {
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
    }
    .section-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .section-item-title { font-size: 13px; font-weight: 600; }
    .grid-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .grid-item-info { flex: 1; }
    .grid-item-name { font-weight: 500; }
    .grid-item-sub { color: var(--text-2); font-size: 11px; }

    /* Theme selector */
    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .theme-option {
      padding: 12px 8px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text);
    }
    .theme-option:hover { border-color: var(--border-focus); }
    .theme-option.active { border-color: var(--accent); background: rgba(59,130,246,0.05); }

    /* Preview */
    .preview {
      background: #000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 0;
      overflow-y: auto;
    }
    .preview-frame {
      width: 375px;
      min-height: 700px;
      border: 2px solid #222;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    .preview-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      min-height: 700px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .preview { display: none; }
    }
  </style>
</head>
<body>

<div class="layout">
  <!-- Left Panel: Editor -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-logo"><span>lyink</span> editor</div>
      <div class="panel-actions">
        <button class="btn btn-sm" onclick="importConfig()">Import</button>
        <button class="btn btn-sm btn-primary" onclick="exportConfig()">Export JSON</button>
        <button class="btn btn-sm" onclick="exportHTML()">Export HTML</button>
      </div>
    </div>

    <!-- Profile -->
    <div class="section">
      <div class="section-header">
        <span class="section-label">Profile</span>
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="cfg-name" placeholder="Your name or brand" oninput="update()">
      </div>
      <div class="field">
        <label>Bio</label>
        <input type="text" id="cfg-bio" placeholder="Short bio" oninput="update()">
      </div>
      <div class="field">
        <label>Avatar URL</label>
        <input type="text" id="cfg-avatar" placeholder="assets/avatar.png" oninput="update()">
      </div>
    </div>

    <!-- Background -->
    <div class="section">
      <div class="section-header">
        <span class="section-label">Background</span>
      </div>
      <div class="field">
        <label>Type</label>
        <select id="cfg-bg-type" onchange="onBgTypeChange(); update()">
          <option value="image">Image / GIF</option>
          <option value="color">Solid Color</option>
          <option value="gradient">Gradient</option>
        </select>
      </div>
      <div id="bg-image-fields">
        <div class="field">
          <label>Image URL</label>
          <input type="text" id="cfg-bg-src" placeholder="assets/bg.gif" oninput="update()">
        </div>
        <div class="field">
          <label>Overlay Opacity</label>
          <input type="range" id="cfg-bg-overlay" min="0" max="1" step="0.05" value="0.55" oninput="update()">
        </div>
      </div>
      <div id="bg-color-fields" style="display:none">
        <div class="field">
          <label>Color</label>
          <input type="color" id="cfg-bg-color" value="#000000" oninput="update()">
        </div>
      </div>
      <div id="bg-gradient-fields" style="display:none">
        <div class="field">
          <label>CSS Gradient</label>
          <input type="text" id="cfg-bg-gradient" placeholder="linear-gradient(135deg, #667eea, #764ba2)" oninput="update()">
        </div>
      </div>
    </div>

    <!-- Theme -->
    <div class="section">
      <div class="section-header">
        <span class="section-label">Theme</span>
      </div>
      <div class="theme-options">
        <button class="theme-option active" data-theme="glass" onclick="setTheme('glass')">Glass</button>
        <button class="theme-option" data-theme="solid" onclick="setTheme('solid')">Solid</button>
        <button class="theme-option" data-theme="minimal" onclick="setTheme('minimal')">Minimal</button>
      </div>
    </div>

    <!-- Links -->
    <div class="section">
      <div class="section-header">
        <span class="section-label">Links</span>
        <button class="btn btn-sm" onclick="openLinkModal()">+ Add Link</button>
      </div>
      <div id="links-list"></div>
    </div>

    <!-- Sections -->
    <div class="section">
      <div class="section-header">
        <span class="section-label">Sections</span>
        <button class="btn btn-sm" onclick="openSectionModal()">+ Add Section</button>
      </div>
      <div id="sections-list"></div>
    </div>

    <!-- SEO -->
    <div class="section">
      <div class="section-header">
        <span class="section-label">SEO</span>
      </div>
      <div class="field">
        <label>Page Title</label>
        <input type="text" id="cfg-seo-title" placeholder="My Links" oninput="update()">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="cfg-seo-desc" placeholder="A short description for search engines" oninput="update()"></textarea>
      </div>
    </div>
  </div>

  <!-- Right Panel: Preview -->
  <div class="preview">
    <div class="preview-frame">
      <iframe id="preview-iframe" src="index.html"></iframe>
    </div>
  </div>
</div>

<!-- Add/Edit Link Modal -->
<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <div class="modal-title" id="link-modal-title">Add Link</div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="link-title" placeholder="WhatsApp">
    </div>
    <div class="field">
      <label>URL</label>
      <input type="url" id="link-url" placeholder="https://...">
    </div>
    <div class="field">
      <label>Icon</label>
      <select id="link-icon">
        <option value="link">Link</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="instagram">Instagram</option>
        <option value="telegram">Telegram</option>
        <option value="twitter">Twitter / X</option>
        <option value="github">GitHub</option>
        <option value="linkedin">LinkedIn</option>
        <option value="youtube">YouTube</option>
        <option value="tiktok">TikTok</option>
        <option value="discord">Discord</option>
        <option value="spotify">Spotify</option>
        <option value="threads">Threads</option>
        <option value="snapchat">Snapchat</option>
        <option value="email">Email</option>
        <option value="website">Website</option>
        <option value="phone">Phone</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeLinkModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveLink()">Save</button>
    </div>
  </div>
</div>

<!-- Add Section Modal -->
<div class="modal-overlay" id="section-modal">
  <div class="modal">
    <div class="modal-title">Add Section</div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="section-title" placeholder="WhatsApp Catalog">
    </div>
    <div class="field">
      <label>Columns</label>
      <select id="section-columns">
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSectionModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSection()">Save</button>
    </div>
  </div>
</div>

<!-- Add Grid Item Modal -->
<div class="modal-overlay" id="grid-item-modal">
  <div class="modal">
    <div class="modal-title">Add Grid Item</div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="grid-item-title" placeholder="Slim Fit">
    </div>
    <div class="field">
      <label>Subtitle</label>
      <input type="text" id="grid-item-subtitle" placeholder="26 photos">
    </div>
    <div class="field">
      <label>URL</label>
      <input type="url" id="grid-item-url" placeholder="https://...">
    </div>
    <div class="field">
      <label>Icon</label>
      <select id="grid-item-icon">
        <option value="image">Image</option>
        <option value="send">Send</option>
        <option value="location">Location</option>
        <option value="link">Link</option>
        <option value="website">Website</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeGridItemModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveGridItem()">Save</button>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <div class="modal-title">Import config.json</div>
    <div class="field">
      <label>Paste your config.json</label>
      <textarea id="import-text" rows="12" style="font-family: monospace; font-size: 11px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeImportModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doImport()">Import</button>
    </div>
  </div>
</div>

<script>
  // State
  let config = {
    name: '',
    bio: '',
    avatar: '',
    background: { type: 'image', src: '', overlay: 0.55 },
    theme: { style: 'glass', radius: 16 },
    links: [],
    sections: [],
    seo: { title: '', description: '' },
    i18n: { enabled: false }
  };

  let editingLinkIndex = -1;
  let editingGridSectionIndex = -1;
  let editingGridItemIndex = -1;
  let debounceTimer = null;

  // Init: load from localStorage or fetch config.json
  async function init() {
    const saved = localStorage.getItem('lyink-draft');
    if (saved) {
      try {
        config = JSON.parse(saved);
      } catch(e) {}
    } else {
      try {
        const res = await fetch('config.json');
        config = await res.json();
      } catch(e) {}
    }
    populateForm();
    renderLinksList();
    renderSectionsList();
    refreshPreview();
  }

  function populateForm() {
    document.getElementById('cfg-name').value = config.name || '';
    document.getElementById('cfg-bio').value = config.bio || '';
    document.getElementById('cfg-avatar').value = config.avatar || '';

    const bg = config.background || {};
    document.getElementById('cfg-bg-type').value = bg.type || 'image';
    document.getElementById('cfg-bg-src').value = bg.src || '';
    document.getElementById('cfg-bg-overlay').value = bg.overlay ?? 0.55;
    document.getElementById('cfg-bg-color').value = bg.color || '#000000';
    document.getElementById('cfg-bg-gradient').value = bg.gradient || '';
    onBgTypeChange();

    const theme = config.theme || {};
    document.querySelectorAll('.theme-option').forEach(function(el) {
      el.classList.toggle('active', el.dataset.theme === (theme.style || 'glass'));
    });

    const seo = config.seo || {};
    document.getElementById('cfg-seo-title').value = seo.title || '';
    document.getElementById('cfg-seo-desc').value = seo.description || '';
  }

  function readForm() {
    config.name = document.getElementById('cfg-name').value;
    config.bio = document.getElementById('cfg-bio').value;
    config.avatar = document.getElementById('cfg-avatar').value;

    const bgType = document.getElementById('cfg-bg-type').value;
    config.background = { type: bgType };
    if (bgType === 'image') {
      config.background.src = document.getElementById('cfg-bg-src').value;
      config.background.overlay = parseFloat(document.getElementById('cfg-bg-overlay').value);
    } else if (bgType === 'color') {
      config.background.color = document.getElementById('cfg-bg-color').value;
    } else if (bgType === 'gradient') {
      config.background.gradient = document.getElementById('cfg-bg-gradient').value;
    }

    config.seo = {
      title: document.getElementById('cfg-seo-title').value,
      description: document.getElementById('cfg-seo-desc').value
    };
  }

  function update() {
    readForm();
    saveDraft();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(refreshPreview, 300);
  }

  function saveDraft() {
    localStorage.setItem('lyink-draft', JSON.stringify(config));
  }

  function refreshPreview() {
    const iframe = document.getElementById('preview-iframe');
    // Write config into a blob URL so iframe can read it
    const configBlob = new Blob([JSON.stringify(config)], { type: 'application/json' });
    const configURL = URL.createObjectURL(configBlob);

    // Create a modified index.html that fetches from blob
    fetch('index.html').then(r => r.text()).then(function(html) {
      // Replace fetch('config.json') with the blob URL
      const modified = html.replace(
        "fetch('config.json')",
        "fetch('" + configURL + "')"
      );
      const blob = new Blob([modified], { type: 'text/html' });
      iframe.src = URL.createObjectURL(blob);
    });
  }

  // Background type toggle
  function onBgTypeChange() {
    const type = document.getElementById('cfg-bg-type').value;
    document.getElementById('bg-image-fields').style.display = type === 'image' ? '' : 'none';
    document.getElementById('bg-color-fields').style.display = type === 'color' ? '' : 'none';
    document.getElementById('bg-gradient-fields').style.display = type === 'gradient' ? '' : 'none';
  }

  // Theme
  function setTheme(style) {
    config.theme = config.theme || {};
    config.theme.style = style;
    document.querySelectorAll('.theme-option').forEach(function(el) {
      el.classList.toggle('active', el.dataset.theme === style);
    });
    update();
  }

  // Links
  function renderLinksList() {
    const list = document.getElementById('links-list');
    list.innerHTML = '';
    config.links.forEach(function(link, i) {
      const el = document.createElement('div');
      el.className = 'link-item';
      el.draggable = true;
      el.dataset.index = i;
      el.innerHTML =
        '<span class="link-drag">&#x2630;</span>' +
        '<div class="link-info">' +
          '<div class="link-info-title">' + escapeHTML(link.title) + '</div>' +
          '<div class="link-info-url">' + escapeHTML(link.url) + '</div>' +
        '</div>' +
        '<div class="link-actions">' +
          '<button class="btn btn-icon btn-sm" onclick="editLink(' + i + ')" title="Edit">&#9998;</button>' +
          '<button class="btn btn-icon btn-sm btn-danger" onclick="deleteLink(' + i + ')" title="Delete">&times;</button>' +
        '</div>';

      // Drag events
      el.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', i);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function() {
        el.classList.remove('dragging');
        list.querySelectorAll('.link-item').forEach(function(x) { x.classList.remove('drag-over'); });
      });
      el.addEventListener('dragover', function(e) {
        e.preventDefault();
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', function() {
        el.classList.remove('drag-over');
      });
      el.addEventListener('drop', function(e) {
        e.preventDefault();
        el.classList.remove('drag-over');
        const from = parseInt(e.dataTransfer.getData('text/plain'));
        const to = i;
        if (from !== to) {
          const item = config.links.splice(from, 1)[0];
          config.links.splice(to, 0, item);
          renderLinksList();
          update();
        }
      });

      list.appendChild(el);
    });
  }

  function openLinkModal(index) {
    editingLinkIndex = index !== undefined ? index : -1;
    const modal = document.getElementById('link-modal');
    const title = document.getElementById('link-modal-title');

    if (editingLinkIndex >= 0) {
      const link = config.links[editingLinkIndex];
      document.getElementById('link-title').value = link.title || '';
      document.getElementById('link-url').value = link.url || '';
      document.getElementById('link-icon').value = link.icon || 'link';
      title.textContent = 'Edit Link';
    } else {
      document.getElementById('link-title').value = '';
      document.getElementById('link-url').value = '';
      document.getElementById('link-icon').value = 'link';
      title.textContent = 'Add Link';
    }
    modal.classList.add('active');
  }

  function closeLinkModal() {
    document.getElementById('link-modal').classList.remove('active');
  }

  function saveLink() {
    const link = {
      title: document.getElementById('link-title').value,
      url: document.getElementById('link-url').value,
      icon: document.getElementById('link-icon').value
    };
    if (!link.title || !link.url) return;

    if (editingLinkIndex >= 0) {
      config.links[editingLinkIndex] = link;
    } else {
      config.links.push(link);
    }
    closeLinkModal();
    renderLinksList();
    update();
  }

  function editLink(i) {
    openLinkModal(i);
  }

  function deleteLink(i) {
    config.links.splice(i, 1);
    renderLinksList();
    update();
  }

  // Sections
  function renderSectionsList() {
    const list = document.getElementById('sections-list');
    list.innerHTML = '';
    config.sections = config.sections || [];
    config.sections.forEach(function(section, si) {
      const el = document.createElement('div');
      el.className = 'section-item';

      let itemsHTML = '';
      (section.items || []).forEach(function(item, ii) {
        itemsHTML +=
          '<div class="grid-item">' +
            '<div class="grid-item-info">' +
              '<div class="grid-item-name">' + escapeHTML(item.title) + '</div>' +
              (item.subtitle ? '<div class="grid-item-sub">' + escapeHTML(item.subtitle) + '</div>' : '') +
            '</div>' +
            '<button class="btn btn-icon btn-sm btn-danger" onclick="deleteGridItem(' + si + ',' + ii + ')" title="Delete">&times;</button>' +
          '</div>';
      });

      el.innerHTML =
        '<div class="section-item-header">' +
          '<span class="section-item-title">' + escapeHTML(section.title || 'Section') + '</span>' +
          '<div style="display:flex;gap:4px">' +
            '<button class="btn btn-sm" onclick="openGridItemModal(' + si + ')">+ Item</button>' +
            '<button class="btn btn-icon btn-sm btn-danger" onclick="deleteSection(' + si + ')">&times;</button>' +
          '</div>' +
        '</div>' +
        itemsHTML;

      list.appendChild(el);
    });
  }

  function openSectionModal() {
    document.getElementById('section-title').value = '';
    document.getElementById('section-columns').value = '2';
    document.getElementById('section-modal').classList.add('active');
  }

  function closeSectionModal() {
    document.getElementById('section-modal').classList.remove('active');
  }

  function saveSection() {
    const title = document.getElementById('section-title').value;
    const columns = parseInt(document.getElementById('section-columns').value);
    if (!title) return;
    config.sections = config.sections || [];
    config.sections.push({ title: title, type: 'grid', columns: columns, items: [] });
    closeSectionModal();
    renderSectionsList();
    update();
  }

  function deleteSection(i) {
    config.sections.splice(i, 1);
    renderSectionsList();
    update();
  }

  // Grid Items
  function openGridItemModal(sectionIndex) {
    editingGridSectionIndex = sectionIndex;
    document.getElementById('grid-item-title').value = '';
    document.getElementById('grid-item-subtitle').value = '';
    document.getElementById('grid-item-url').value = '';
    document.getElementById('grid-item-icon').value = 'image';
    document.getElementById('grid-item-modal').classList.add('active');
  }

  function closeGridItemModal() {
    document.getElementById('grid-item-modal').classList.remove('active');
  }

  function saveGridItem() {
    const item = {
      title: document.getElementById('grid-item-title').value,
      subtitle: document.getElementById('grid-item-subtitle').value,
      url: document.getElementById('grid-item-url').value,
      icon: document.getElementById('grid-item-icon').value
    };
    if (!item.title) return;
    config.sections[editingGridSectionIndex].items.push(item);
    closeGridItemModal();
    renderSectionsList();
    update();
  }

  function deleteGridItem(si, ii) {
    config.sections[si].items.splice(ii, 1);
    renderSectionsList();
    update();
  }

  // Export
  function exportConfig() {
    readForm();
    const json = JSON.stringify(config, null, 2);
    download('config.json', json, 'application/json');
  }

  async function exportHTML() {
    readForm();
    try {
      const [htmlRes, iconsRes] = await Promise.all([
        fetch('index.html').then(r => r.text()),
        fetch('icons.svg').then(r => r.text())
      ]);

      // Embed config and icons inline
      const configScript = '<script>window.__IDID_CONFIG__ = ' + JSON.stringify(config) + ';<\/script>';
      const iconsEmbed = iconsRes;

      let html = htmlRes;
      // Replace fetch with embedded config
      html = html.replace(
        "fetch('config.json')",
        "Promise.resolve({ json: () => window.__IDID_CONFIG__ })"
      );
      // Replace icon loading with embedded
      html = html.replace(
        '</head>',
        configScript + '\n' + iconsEmbed + '\n</head>'
      );
      // Replace loadIcons to parse from embedded SVG
      html = html.replace(
        "const res = await fetch('icons.svg');",
        "const res = { text: async () => document.querySelector('svg[style]').outerHTML };"
      );

      download('index.html', html, 'text/html');
    } catch(e) {
      console.error('Export failed:', e);
      alert('Export failed. Make sure index.html and icons.svg are accessible.');
    }
  }

  // Import
  function importConfig() {
    document.getElementById('import-text').value = '';
    document.getElementById('import-modal').classList.add('active');
  }

  function closeImportModal() {
    document.getElementById('import-modal').classList.remove('active');
  }

  function doImport() {
    try {
      const text = document.getElementById('import-text').value;
      config = JSON.parse(text);
      populateForm();
      renderLinksList();
      renderSectionsList();
      update();
      closeImportModal();
    } catch(e) {
      alert('Invalid JSON');
    }
  }

  // Helpers
  function download(filename, content, type) {
    const blob = new Blob([content], { type: type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  init();
</script>

</body>
</html>
