<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentin SBX</title>
  <meta name="description" content="Dev · Dibujo · Escribo xd">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --radius: 12px;
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #1a1a1a;
      --border: #222222;
      --border-hover: #333333;
      --text: #f5f5f5;
      --text-2: #888888;
      --text-3: #555555;
      --accent: #8b5cf6;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ===== LAYOUT ===== */
    .app {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      min-height: 100vh;
    }

    /* ===== MAIN CONTENT ===== */
    .main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Profile */
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .profile-bio {
      font-size: 14px;
      color: var(--text-2);
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .filter {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      background: transparent;
      transition: all 0.15s;
    }
    .filter:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    .filter.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(139, 92, 246, 0.1);
    }

    /* Links grid */
    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      transition: all 0.15s;
    }
    .link:hover {
      border-color: var(--border-hover);
      background: var(--surface-2);
    }
    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .link-info { flex: 1; min-width: 0; }
    .link-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .link-url {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Highlighted (sorted first) */
    .link.highlight {
      border-color: rgba(139, 92, 246, 0.4);
    }
    .link.highlight .link-icon {
      border-color: rgba(139, 92, 246, 0.4);
      color: var(--accent);
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-left: 24px;
      border-left: 1px solid var(--border);
      height: fit-content;
    }
    .nav-group { display: flex; flex-direction: column; gap: 4px; }
    .nav-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      transition: all 0.15s;
      text-align: left;
      width: 100%;
    }
    .nav-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
    }
    .nav-item.active .dot { background: var(--accent); }
    .nav-item .label { flex: 1; }
    .nav-item .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--text-3);
      border: 1px solid var(--border);
    }
    .nav-item .badge.warn {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.08);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 780px) {
      .app {
        grid-template-columns: 1fr;
        padding: 20px 16px;
        gap: 20px;
      }
      .sidebar {
        padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--border);
        padding-top: 20px;
        order: -1;
      }
      .links { grid-template-columns: 1fr; }
      .avatar { width: 60px; height: 60px; }
      .profile-name { font-size: 19px; }
    }

    @media (max-width: 400px) {
      .app { padding: 16px 12px; }
      .link { padding: 12px; }
      .link-icon { width: 32px; height: 32px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Profile -->
    <div class="profile">
      <div class="avatar">
        <img src="https://github.com/Valentin-sbox.png" alt="Valentin SBX" id="avatar">
      </div>
      <div class="profile-info">
        <div class="profile-name" id="name">Valentin SBX</div>
        <div class="profile-bio" id="bio">Dev · Dibujo · Escribo xd</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">Todos</button>
      <button class="filter" data-filter="stack">Stack</button>
      <button class="filter" data-filter="escritor">Escritor</button>
      <button class="filter" data-filter="art">Art Worker</button>
    </div>

    <!-- Links -->
    <div class="links" id="links"></div>

  </main>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">

    <div class="nav-group">
      <div class="nav-title">Inicio</div>
      <button class="nav-item active">
        <span class="dot"></span>
        <span class="label">Inicio</span>
      </button>
      <button class="nav-item">
        <span class="dot"></span>
        <span class="label">Redes sociales</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-title">Mis proyectos</div>
      <button class="nav-item">
        <span class="dot"></span>
        <span class="label">Bloopy</span>
        <span class="badge">JS</span>
      </button>
      <button class="nav-item">
        <span class="dot"></span>
        <span class="label">Biolinks</span>
        <span class="badge">Web</span>
      </button>
      <button class="nav-item">
        <span class="dot"></span>
        <span class="label">Próximamente</span>
        <span class="badge warn">Mantenimiento</span>
      </button>
    </div>

  </aside>

</div>

<script>
  // ===== CONFIG =====
  const config = {
    name: "Valentin SBX",
    bio: "Dev · Dibujo · Escribo xd",
    avatar: "https://github.com/Valentin-sbox.png",
    links: [
      { name: "Pixiv", url: "https://www.pixiv.net/en/users/91075371", tags: ["art"], icon: "Pi" },
      { name: "Instagram", url: "https://www.instagram.com/valentinhere1/", tags: ["art"], icon: "Ig" },
      { name: "ArtStation", url: "https://valentinhere.artstation.com", tags: ["art"], icon: "As" },
      { name: "GitHub", url: "https://github.com/Valentin-sbox", tags: ["stack"], icon: "Gh" },
      { name: "Discord", url: "https://discord.gg/tu-invitacion", tags: ["stack"], icon: "Dc" },
      { name: "Patreon", url: "https://patreon.com/tu-usuario", tags: ["art"], icon: "Pa" }
    ]
  };

  // ===== RENDER =====
  const linksEl = document.getElementById('links');
  const filtersEl = document.getElementById('filters');

  document.getElementById('name').textContent = config.name;
  document.getElementById('bio').textContent = config.bio;
  document.getElementById('avatar').src = config.avatar;

  let activeFilter = 'all';

  function renderLinks() {
    // Ordenar: los que coinciden con el filtro van primero
    let sorted = [...config.links];
    if (activeFilter !== 'all') {
      sorted.sort((a, b) => {
        const aMatch = (a.tags || []).includes(activeFilter);
        const bMatch = (b.tags || []).includes(activeFilter);
        if (aMatch && !bMatch) return -1;
        if (!aMatch && bMatch) return 1;
        return 0;
      });
    }

    linksEl.innerHTML = '';
    sorted.forEach(link => {
      const isHighlight = activeFilter !== 'all' && (link.tags || []).includes(activeFilter);
      const a = document.createElement('a');
      a.className = 'link' + (isHighlight ? ' highlight' : '');
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="link-icon">${link.icon || link.name[0]}</div>
        <div class="link-info">
          <div class="link-title">${link.name}</div>
          <div class="link-url">${link.url.replace(/^https?:\/\//, '')}</div>
        </div>
      `;
      linksEl.appendChild(a);
    });
  }

  // ===== FILTERS =====
  filtersEl.addEventListener('click', e => {
    const btn = e.target.closest('.filter');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    filtersEl.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
    btn.classList.add('active');
    renderLinks();
  });

  // ===== SIDEBAR NAV =====
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });

  renderLinks();
</script>

</body>
</html>
