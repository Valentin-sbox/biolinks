<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentinhere1</title>
  <meta name="description" content="Web developer · Escritor · ArtWorks">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --radius: 12px;
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #1a1a1a;
      --border: #222222;
      --border-hover: #333333;
      --text: #f5f5f5;
      --text-2: #888888;
      --text-3: #555555;
      --accent: #8b5cf6;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ===== LAYOUT ===== */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      min-height: 100vh;
    }

    /* ===== SIDEBAR (izquierda) ===== */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      height: fit-content;
      position: sticky;
      top: 32px;
    }
    .nav-group { display: flex; flex-direction: column; gap: 4px; }
    .nav-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
      padding-left: 10px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      transition: all 0.15s;
      text-align: left;
      width: 100%;
    }
    .nav-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
    }
    .nav-item.active .dot { background: var(--accent); }
    .nav-item .label { flex: 1; }
    .nav-item .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--text-3);
      border: 1px solid var(--border);
    }
    .nav-item .badge.warn {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.08);
    }

    /* Discord separated */
    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ===== MAIN ===== */
    .main {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    /* Profile */
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .profile-bio {
      font-size: 14px;
      color: var(--text-2);
    }

    /* Links grid */
    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      transition: all 0.15s;
    }
    .link:hover {
      border-color: var(--border-hover);
      background: var(--surface-2);
    }
    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .link-icon svg {
      width: 18px;
      height: 18px;
    }
    .link-info { flex: 1; min-width: 0; }
    .link-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .link-url {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== HAMBURGER (mobile) ===== */
    .hamburger {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
    }
    .hamburger span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: all 0.2s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .sidebar-overlay.active { opacity: 1; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 780px) {
      .app {
        grid-template-columns: 1fr;
        padding: 64px 16px 24px;
        gap: 20px;
      }
      .hamburger { display: flex; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        background: var(--bg);
        border-right: 1px solid var(--border);
        padding: 64px 16px 24px;
        z-index: 95;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        overflow-y: auto;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .links { grid-template-columns: 1fr; }
      .avatar { width: 60px; height: 60px; }
      .profile-name { font-size: 19px; }
    }

    @media (max-width: 400px) {
      .app { padding: 60px 12px 20px; }
      .link { padding: 12px; }
      .link-icon { width: 32px; height: 32px; }
      .link-icon svg { width: 16px; height: 16px; }
    }
  </style>
</head>
<body>

<!-- Hamburger button (mobile) -->
<button class="hamburger" id="hamburger" aria-label="Menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div class="sidebar-overlay" id="overlay"></div>

<div class="app">

  <!-- ===== SIDEBAR (izquierda) ===== -->
  <aside class="sidebar" id="sidebar">

    <div class="nav-group">
      <div class="nav-title">Inicio</div>
      <button class="nav-item active">
        <span class="dot"></span>
        <span class="label">Inicio</span>
      </button>
      <button class="nav-item">
        <span class="dot"></span>
        <span class="label">Redes sociales</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-title">Mis proyectos</div>
      <button class="nav-item">
        <span class="dot"></span>
        <span class="label">Proyectos</span>
        <span class="badge warn">Mantenimiento</span>
      </button>
    </div>

    <div class="sidebar-divider"></div>

    <div class="nav-group">
      <div class="nav-title">Comunidad</div>
      <a class="nav-item" href="https://discord.gg/tu-invitacion" target="_blank" rel="noopener noreferrer">
        <span class="dot"></span>
        <span class="label">Discord</span>
      </a>
    </div>

  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Profile -->
    <div class="profile">
      <div class="avatar">
        <img src="https://github.com/Valentin-sbox.png" alt="Valentinhere1" id="avatar">
      </div>
      <div class="profile-info">
        <div class="profile-name" id="name">Valentinhere1</div>
        <div class="profile-bio" id="bio">Web developer · Escritor · ArtWorks</div>
      </div>
    </div>

    <!-- Links -->
    <div class="links" id="links"></div>

  </main>

</div>

<script>
  // ===== CONFIG =====
  const config = {
    name: "Valentinhere1",
    bio: "Web developer · Escritor · ArtWorks (dibujos hobby)",
    avatar: "https://github.com/Valentin-sbox.png",
    links: [
      { name: "Pixiv", url: "https://www.pixiv.net/en/users/91075371", icon: "pixiv" },
      { name: "Instagram", url: "https://www.instagram.com/valentinhere1/", icon: "instagram" },
      { name: "ArtStation", url: "https://valentinhere.artstation.com", icon: "artstation" },
      { name: "GitHub", url: "https://github.com/Valentin-sbox", icon: "github" }
    ]
  };

  // ===== ICONS via Simple Icons CDN =====
  const ICON_CDN = "https://cdn.simpleicons.org/";

  function getIcon(name) {
    return `<img src="${ICON_CDN}${name}" alt="${name}" width="18" height="18" loading="lazy" onerror="this.style.display='none'">`;
  }

  // ===== RENDER =====
  const linksEl = document.getElementById('links');

  document.getElementById('name').textContent = config.name;
  document.getElementById('bio').textContent = config.bio;
  document.getElementById('avatar').src = config.avatar;

  function renderLinks() {
    linksEl.innerHTML = '';
    config.links.forEach(link => {
      const a = document.createElement('a');
      a.className = 'link';
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="link-icon">${getIcon(link.icon)}</div>
        <div class="link-info">
          <div class="link-title">${link.name}</div>
          <div class="link-url">${link.url.replace(/^https?:\/\//, '')}</div>
        </div>
      `;
      linksEl.appendChild(a);
    });
  }

  renderLinks();

  // ===== HAMBURGER =====
  const hamburger = document.getElementById('hamburger');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  function toggleMenu() {
    hamburger.classList.toggle('open');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
  }

  hamburger.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);

  // Cerrar al hacer clic en un nav-item (mobile)
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      if (window.innerWidth <= 780 && sidebar.classList.contains('open')) {
        toggleMenu();
      }
      // Marcar activo
      if (!item.getAttribute('href')) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      }
    });
  });
</script>

</body>
</html>
