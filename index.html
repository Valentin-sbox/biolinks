<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentinhere1</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="description" content="Web developer · Escritor · ArtWorks">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --radius: 12px;
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #1a1a1a;
  --border: #222222;
  --border-hover: #333333;
  --text: #f5f5f5;
  --text-2: #888888;
  --text-3: #555555;
  --accent: #8b5cf6;
}

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 24px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
  min-height: 100vh;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 24px;
  height: fit-content;
  position: sticky;
  top: 32px;
}
.nav-group { display: flex; flex-direction: column; gap: 4px; }
.nav-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
  padding-left: 10px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  transition: all 0.15s;
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--surface); color: var(--text); }
.nav-item .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
}
.nav-item.active .dot { background: var(--accent); }
.nav-item .label { flex: 1; }
.nav-item .badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--text-3);
  border: 1px solid var(--border);
}
.nav-item .badge.warn {
  color: #f59e0b;
  border-color: rgba(245, 158, 11, 0.3);
  background: rgba(245, 158, 11, 0.08);
}
.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

.main {
  display: flex;
  flex-direction: column;
  gap: 32px;
  min-width: 0;
}

.profile {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
}
.avatar {
  width: 72px; height: 72px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-info { flex: 1; min-width: 0; }
.profile-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.profile-bio { font-size: 14px; color: var(--text-2); }

.flag {
  position: relative;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
}

.flag::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 10;
}

.flag::before {
  content: '';
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  border: 5px solid transparent;
  border-top-color: var(--surface-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 10;
}

.flag:hover::after,
.flag:hover::before,
.flag:focus::after,
.flag:focus::before,
.flag.active::after,
.flag.active::before {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 12px;
}

.links {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: all 0.15s;
}
.link:hover { border-color: var(--border-hover); background: var(--surface-2); }
.link-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.link-icon img { width: 18px; height: 18px; display: block; }
.link-info { flex: 1; min-width: 0; }
.link-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.link-url {
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link[href*="github.com"] .link-icon {
  background: #ffffff;
  border-color: #ffffff;
}
.link[href*="github.com"] .link-icon img {
  filter: none;
}

.link[href*="pixiv.net"] .link-icon {
  background: rgba(0, 145, 234, 0.15);
  border-color: rgba(0, 145, 234, 0.4);
}
.link[href*="pixiv.net"] .link-icon img {
  filter: drop-shadow(0 0 6px rgba(0, 145, 234, 0.5));
}

.discord-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: all 0.15s;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
}
.discord-bar:hover { border-color: var(--border-hover); background: var(--surface-2); color: var(--text); }
.discord-bar img { width: 20px; height: 20px; display: block; }

.hamburger {
  display: none;
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
.hamburger span {
  display: block;
  width: 18px; height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all 0.2s;
}
.hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 90;
  opacity: 0;
  transition: opacity 0.2s;
}
.sidebar-overlay.active { opacity: 1; display: block; }

.page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.content {
  flex: 1;
}

.footer {
  width: 100%;
  border-top: 1px solid var(--border);
  padding: 20px 24px;
  margin-top: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
  color: var(--text-3);
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
}
.footer-left { display: flex; align-items: center; gap: 12px; }
.footer-right { display: flex; align-items: center; gap: 8px; }

.lang-switch {
  display: flex;
  gap: 4px;
}
.lang-switch button {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--text-3);
  transition: all 0.15s;
}
.lang-switch button.active {
  color: var(--text);
  border-color: var(--accent);
  background: rgba(139, 92, 246, 0.1);
}

@media (max-width: 780px) {
  .app {
    grid-template-columns: 1fr;
    padding: 24px 16px 24px;
    gap: 20px;
  }
  .hamburger { display: flex; }
  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 260px;
    height: 100vh;
    background: var(--bg);
    border-left: 1px solid var(--border);
    padding: 64px 16px 24px;
    z-index: 95;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
  }
  .sidebar.open { transform: translateX(0); }
  .links { grid-template-columns: repeat(2, 1fr); }
  .link {
    flex-direction: column;
    gap: 6px;
    padding: 12px 8px;
    text-align: center;
  }
  .link-icon { width: 40px; height: 40px; }
  .link-icon img { width: 20px; height: 20px; }
  .link-info { width: 100%; }
  .link-title { font-size: 11px; }
  .link-url { display: none; }
  .avatar { width: 60px; height: 60px; }
  .profile-name { font-size: 19px; }
}

@media (max-width: 400px) {
  .app { padding: 20px 12px; }
  .link { padding: 10px 6px; }
  .link-icon { width: 36px; height: 36px; }
  .link-icon img { width: 18px; height: 18px; }
}
</style>
</head>
<body>

<div class="page">

  <div class="app content">

    <aside class="sidebar" id="sidebar">
      <div class="nav-group">
        <div class="nav-title" data-i18n="nav.inicio">Inicio</div>
        <a class="nav-item active" href="#inicio">
          <span class="dot"></span>
          <span class="label" data-i18n="nav.inicio">Inicio</span>
        </a>
        <a class="nav-item" href="#sobre-mi">
          <span class="dot"></span>
          <span class="label" data-i18n="nav.sobre">Sobre mí</span>
        </a>
        <a class="nav-item" href="#redes">
          <span class="dot"></span>
          <span class="label" data-i18n="nav.redes">Redes sociales</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-title" data-i18n="nav.proyectos">Mis proyectos</div>
        <button class="nav-item">
          <span class="dot"></span>
          <span class="label" data-i18n="nav.proyectos">Proyectos</span>
          <span class="badge warn" data-i18n="nav.mantenimiento">Mantenimiento</span>
        </button>
      </div>
    </aside>

    <main class="main">

      <section id="inicio" class="profile">
        <div class="avatar">
          <img src="favicon.svg " alt="Valentinhere1" id="avatar">
        </div>
        <div class="profile-info">
          <div class="profile-name">
            <span id="name">Valentinhere1</span>
            <span class="flag" data-tooltip="El mejor país del mundo">🇦🇷</span>
          </div>
          <div class="profile-bio" id="bio" data-i18n="bio">Web developer · Escritor · ArtWorks</div>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </section>

      <section id="sobre-mi">
        <div class="section-title" data-i18n="section.sobre">Sobre mí</div>
        <p style="font-size:14px; color:var(--text-2); line-height:1.6;" data-i18n="sobre.texto">
          Hago webs con PHP, JS y CSS. Cuando no estoy programando, escribo historias y dibujo lo que se me ocurre.
        </p>
      </section>

      <section id="redes">
        <div class="section-title" data-i18n="section.redes">Redes sociales</div>
        <div class="links" id="links"></div>
      </section>

      <a class="discord-bar" href="https://discord.gg/253ByDH9ds" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.simpleicons.org/discord" alt="Discord">
        <span data-i18n="discord.texto">Unite a mi Discord</span>
      </a>

    </main>

  </div>

  <footer class="footer">
    <div class="footer-left">
      <span>© 2026 Valentinhere1</span>
    </div>
    <div class="footer-right">
      <div class="lang-switch">
        <button data-lang="es" class="active">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </footer>

</div>

<div class="sidebar-overlay" id="overlay"></div>

<script>
const config = {
  name: "Valentinhere1",
  bio: "Web developer · Escritor · ArtWorks",
  avatar: "https://github.com/Valentin-sbox.png",
  links: [
    { name: "Pixiv", url: "https://www.pixiv.net/en/users/91075371", icon: "pixiv" },
    { name: "Instagram", url: "https://www.instagram.com/valentinhere1/", icon: "instagram" },
    { name: "ArtStation", url: "https://valentinhere1.artstation.com", icon: "artstation" },
    { name: "GitHub", url: "https://github.com/Valentin-sbox", icon: "github" }
  ]
};

const i18n = {
  es: {
    "nav.inicio": "Inicio",
    "nav.sobre": "Sobre mí",
    "nav.redes": "Redes sociales",
    "nav.proyectos": "Mis proyectos",
    "nav.mantenimiento": "Mantenimiento",
    "nav.comunidad": "Comunidad",
    "bio": "Web developer · Escritor · ArtWorks",
    "section.sobre": "Sobre mí",
    "sobre.texto": "Hago webs con PHP, JS y CSS. Cuando no estoy programando, escribo historias y dibujo lo que se me ocurre.",
    "section.redes": "Redes sociales",
    "discord.texto": "Unite a mi Discord"
  },
  en: {
    "nav.inicio": "Home",
    "nav.sobre": "About me",
    "nav.redes": "Social media",
    "nav.proyectos": "My projects",
    "nav.mantenimiento": "Maintenance",
    "nav.comunidad": "Community",
    "bio": "Web developer · Writer · ArtWorks",
    "section.sobre": "About me",
    "sobre.texto": "I build websites with PHP, JS and CSS. When I'm not coding, I write stories and draw whatever comes to mind.",
    "section.redes": "Social media",
    "discord.texto": "Join my Discord"
  }
};

function detectLang() {
  const saved = localStorage.getItem('lang');
  if (saved) return saved;
  const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const langCode = nav.slice(0, 2);
  const esLike = ['es', 'pt', 'gl', 'ca', 'it', 'fr', 'ro'];
  if (esLike.includes(langCode)) return 'es';
  return 'en';
}

let currentLang = detectLang();

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang] && i18n[lang][key]) {
      el.textContent = i18n[lang][key];
    }
  });
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

const ICON_CDN = "https://cdn.simpleicons.org/";

function getIcon(name) {
  return `<img src="${ICON_CDN}${name}" alt="${name}" loading="lazy">`;
}

const linksEl = document.getElementById('links');

document.getElementById('name').textContent = config.name;
document.getElementById('avatar').src = config.avatar;

function renderLinks() {
  linksEl.innerHTML = '';
  config.links.forEach(link => {
    const a = document.createElement('a');
    a.className = 'link';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = link.name;
    a.innerHTML = `
      <div class="link-icon">${getIcon(link.icon)}</div>
      <div class="link-info">
        <div class="link-title">${link.name}</div>
        <div class="link-url">${link.url.replace(/^https?:\/\//, '')}</div>
      </div>
    `;
    linksEl.appendChild(a);
  });
}

renderLinks();

const hamburger = document.getElementById('hamburger');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

function toggleMenu() {
  hamburger.classList.toggle('open');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
}

hamburger.addEventListener('click', toggleMenu);
overlay.addEventListener('click', toggleMenu);

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    if (window.innerWidth <= 780 && sidebar.classList.contains('open')) {
      toggleMenu();
    }
    if (!item.getAttribute('href')) return;
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
  });
});

document.querySelector('.flag').addEventListener('click', function() {
  this.classList.toggle('active');
});

document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

applyLang(currentLang);
</script>

</body>
</html>
