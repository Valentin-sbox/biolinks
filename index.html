<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --radius: 12px;
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #1a1a1a;
  --border: #222222;
  --border-hover: #333333;
  --text: #f5f5f5;
  --text-2: #888888;
  --text-3: #555555;
  --accent: #8b5cf6;
}

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.app {
  max-width: 680px;
  margin: 0 auto;
  padding: 32px 24px;
  min-height: 100vh;
}

.main {
  display: flex;
  flex-direction: column;
  gap: 32px;
  min-width: 0;
}

.profile {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
}
.avatar {
  width: 72px; height: 72px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-info { flex: 1; min-width: 0; }
.profile-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.profile-bio { font-size: 14px; color: var(--text-2); }

/* Acciones en la misma fila del Perfil (PC / Tablet) */
.profile-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.nav-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  transition: all 0.15s;
}
.nav-icon-btn:hover, .nav-icon-btn.active {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-hover);
}
.nav-icon-btn svg { width: 18px; height: 18px; }

.lang-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 0 10px;
  height: 38px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  transition: all 0.15s;
}
.lang-btn:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-hover);
}

/* Botón y Menú Desplegable flotante en Mobile */
.profile-actions-dropdown {
  display: none;
  position: relative;
}

.more-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.more-btn:hover, .more-btn.active {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-hover);
}
.more-btn svg { width: 20px; height: 20px; }

.more-menu {
  display: none;
  position: absolute;
  right: 0;
  top: 100%;
  margin-top: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 1000;
  min-width: 180px;
  padding: 6px 0;
}
.more-menu.active {
  display: block;
}

.more-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
  width: 100%;
  text-align: left;
}
.more-item:hover, .more-item.active {
  background: var(--surface-2);
  color: var(--text);
}
.more-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.menu-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

.flag {
  position: relative;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
}

.flag::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 10;
}

.flag::before {
  content: '';
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  border: 5px solid transparent;
  border-top-color: var(--surface-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 10;
}

.flag:hover::after,
.flag:hover::before,
.flag:focus::after,
.flag:focus::before,
.flag.active::after,
.flag.active::before {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 12px;
}

.links {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: all 0.15s;
}
.link:hover { border-color: var(--border-hover); background: var(--surface-2); }
.link-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.link-icon img { width: 18px; height: 18px; display: block; }
.link-info { flex: 1; min-width: 0; }
.link-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.link-url {
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link[href*="github.com"] .link-icon {
  background: #ffffff;
  border-color: #ffffff;
}

/* Destacado plano 2D para Pixiv */
.link[href*="pixiv.net"] {
  border: 2px solid #0091ea;
}

.discord-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: all 0.15s;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
}
.discord-bar:hover { border-color: var(--border-hover); background: var(--surface-2); color: var(--text); }
.discord-bar img { width: 20px; height: 20px; display: block; }

.projects-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.project-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: all 0.15s;
}
.project-card:hover { border-color: var(--border-hover); background: var(--surface-2); }
.project-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.project-title { font-size: 15px; font-weight: 700; color: var(--text); }
.project-desc { font-size: 13px; color: var(--text-2); line-height: 1.4; margin-bottom: 12px; }
.project-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  text-transform: uppercase;
  width: fit-content;
}
.project-tag.activo {
  color: #10b981;
  border: 1px solid rgba(16, 185, 129, 0.3);
  background: rgba(16, 185, 129, 0.08);
}
.project-tag.paused, .project-tag.Paused {
  color: #f59e0b;
  border: 1px solid rgba(245, 158, 11, 0.3);
  background: rgba(245, 158, 11, 0.08);
}
.project-tag.finalizado {
  color: #3b82f6;
  border: 1px solid rgba(59, 130, 246, 0.3);
  background: rgba(59, 130, 246, 0.08);
}

@media (max-width: 780px) {
  .app {
    padding: 24px 16px;
  }
  
  .profile-actions { display: none; }
  .profile-actions-dropdown { display: block; }

  .links { grid-template-columns: repeat(2, 1fr); }
  .projects-grid { grid-template-columns: repeat(1, 1fr); }
  
  .link {
    flex-direction: column;
    gap: 6px;
    padding: 12px 8px;
    text-align: center;
  }
  .link-icon { width: 40px; height: 40px; }
  .link-icon img { width: 20px; height: 20px; }
  .link-info { width: 100%; }
  .link-title { font-size: 11px; }
  .link-url { display: none; }
  .avatar { width: 60px; height: 60px; }
  .profile-name { font-size: 19px; }
}

@media (max-width: 400px) {
  .app { padding: 20px 12px; }
  .link { padding: 10px 6px; }
  .link-icon { width: 36px; height: 36px; }
  .link-icon img { width: 18px; height: 18px; }
}
</style>

const config = {
  name: "Valentinhere1",
  bio: "Web developer · Escritor · ArtWorks",

  links: [

    { name: "Instagram", url: "https://www.instagram.com/valentinhere1/", icon: "instagram" },
    { name: "ArtStation", url: "https://valentinhere1.artstation.com", icon: "artstation" },
    { name: "GitHub", url: "https://github.com/Valentin-sbox", icon: "github" },
    { name: "Tapas", url: "https://tapas.io/valentinhere1", icon: "tapas" }
  ],
  projects: [
    {
      title: "La aventura antes del caos (novela)",
      type: "Novela Web",
      status: "Paused",
      url: "https://tapas.io/series/La-Aventura-antes-del-caos/info",
      desc: "En un universo creado por Origen, un dios omnipotente que anhelaba algo que nunca podría tener. Nuestra protagonista nace de ese anhelo en un mundo envuelto en caos..."
    }
  ]
};

const i18n = {
  es: {
    "nav.inicio": "Inicio",
    "nav.sobre": "Sobre mí",
    "nav.redes": "Redes sociales",
    "nav.proyectos": "Mis proyectos",
    "nav.comunidad": "Comunidad",
    "bio": "Web developer · Escritor · ArtWorks",
    "section.sobre": "Sobre mí",
    "sobre.texto": "Hago webs con PHP, JS y CSS. Cuando no estoy programando, escribo historias y dibujo lo que se me ocurre.",
    "section.redes": "Redes sociales",
    "discord.texto": "Unite a mi Discord",
    "status.activo": "Activo",
    "status.paused": "Pausado",
    "status.finalizado": "Finalizado"
  },
  en: {
    "nav.inicio": "Home",
    "nav.sobre": "About me",
    "nav.redes": "Social media",
    "nav.proyectos": "My projects",
    "nav.comunidad": "Community",
    "bio": "Web developer · Writer · ArtWorks",
    "section.sobre": "About me",
    "sobre.texto": "I build websites with PHP, JS and CSS. When I'm not coding, I write stories and draw whatever comes to mind.",
    "section.redes": "Social media",
    "discord.texto": "Join my Discord",
    "status.activo": "Active",
    "status.paused": "Paused",
    "status.finalizado": "Finished"
  }
};

function detectLang() {
  const saved = localStorage.getItem('lang');
  if (saved) return saved;
  const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const langCode = nav.slice(0, 2);
  const esLike = ['es', 'pt', 'gl', 'ca', 'it', 'fr', 'ro'];
  if (esLike.includes(langCode)) return 'es';
  return 'en';
}

let currentLang = detectLang();

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang] && i18n[lang][key]) {
      el.textContent = i18n[lang][key];
    }
  });
  
  const langBtn = document.getElementById('lang-btn');
  if (langBtn) {
    langBtn.textContent = lang === 'es' ? 'EN' : 'ES';
  }

  const mobileLangLabel = document.getElementById('mobile-lang-label');
  if (mobileLangLabel) {
    mobileLangLabel.textContent = `Idioma: ${lang === 'es' ? 'EN' : 'ES'}`;
  }
  
  renderProjects();
}

const ICON_CDN = "https://cdn.simpleicons.org/";

function getIcon(name) {
  if (name === "tapas") {
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.8L19.2 8 12 11.2 4.8 8 12 4.8zM4 9.6l7 3.1v6.9l-7-3.5V9.6zm16 6.5l-7 3.5v-6.9l7-3.1v6.5z"/></svg>`;
  }
  return `<img src="${ICON_CDN}${name}" alt="${name}" loading="lazy">`;
}

const linksEl = document.getElementById('links');

document.getElementById('name').textContent = config.name;
document.getElementById('avatar').src = config.avatar;

function renderLinks() {
  linksEl.innerHTML = '';
  config.links.forEach(link => {
    const a = document.createElement('a');
    a.className = 'link';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = link.name;
    a.innerHTML = `
      <div class="link-icon">${getIcon(link.icon)}</div>
      <div class="link-info">
        <div class="link-title">${link.name}</div>
        <div class="link-url">${link.url.replace(/^https?:\/\//, '')}</div>
      </div>
    `;
    linksEl.appendChild(a);
  });
}

const projectsGrid = document.getElementById('projects-grid');

function renderProjects() {
  projectsGrid.innerHTML = '';
  config.projects.forEach(project => {
    const statusKey = project.status.toLowerCase();
    const statusText = i18n[currentLang][`status.${statusKey}`] || project.status;
    const card = document.createElement('a');
    card.className = 'project-card';
    card.href = project.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.innerHTML = `
      <div>
        <div class="project-header">
          <div class="project-title">${project.title}</div>
        </div>
        <div class="project-desc">${project.desc}</div>
      </div>
      <span class="project-tag ${statusKey}">${statusText}</span>
    `;
    projectsGrid.appendChild(card);
  });
}

renderLinks();
renderProjects();

const mainContent = document.getElementById('main-content');
const projectsContent = document.getElementById('projects-content');

function showSection(section) {
  if (section === 'projects') {
    mainContent.style.display = 'none';
    projectsContent.style.display = 'flex';
  } else {
    mainContent.style.display = 'flex';
    projectsContent.style.display = 'none';
  }

  // Actualizar estado activo en botones desktop y mobile
  document.querySelectorAll('[data-section]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.section === section);
  });
}

// Eventos de navegación en Desktop y Mobile
document.querySelectorAll('[data-section]').forEach(btn => {
  btn.addEventListener('click', () => {
    showSection(btn.dataset.section);
    moreMenu.classList.remove('active');
    moreBtn.classList.remove('active');
  });
});

// Control del Menú Desplegable Flotante en Mobile
const moreBtn = document.getElementById('more-btn');
const moreMenu = document.getElementById('more-menu');

moreBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  moreMenu.classList.toggle('active');
  moreBtn.classList.toggle('active');
});

document.addEventListener('click', (e) => {
  if (!moreMenu.contains(e.target) && !moreBtn.contains(e.target)) {
    moreMenu.classList.remove('active');
    moreBtn.classList.remove('active');
  }
});

document.querySelector('.flag').addEventListener('click', function() {
  this.classList.toggle('active');
});

// Eventos de cambio de idioma (Desktop y Mobile)
const toggleLang = () => {
  const nextLang = currentLang === 'es' ? 'en' : 'es';
  applyLang(nextLang);
};

document.getElementById('lang-btn').addEventListener('click', toggleLang);
document.getElementById('mobile-lang-btn').addEventListener('click', () => {
  toggleLang();
  moreMenu.classList.remove('active');
  moreBtn.classList.remove('active');
});

applyLang(currentLang);
</script>

</body>
</html>
